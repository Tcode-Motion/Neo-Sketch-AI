<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <!-- Sweep gradient emulation for rainbow swirl -->
    <linearGradient id="rainbow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="25%" stop-color="#2979FF"/>
      <stop offset="50%" stop-color="#651FFF"/>
      <stop offset="75%" stop-color="#F50057"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>

    <!-- Metallic Brush Handle Gradient -->
    <linearGradient id="brushHandle" x1="28" y1="80" x2="90" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- White Bristle Tip Gradient -->
    <linearGradient id="bristleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Dark Squircle Canvas Background (Matching NeoSketchLogo 0xFF0C101B) -->
  <rect x="2" y="2" width="104" height="104" rx="25" fill="#0C101B" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Rainbow Paint Swirl Arc (startAngle -120deg, sweep 310deg) -->
  <path d="M 33.4 18.3 A 41 41 0 1 1 17.5 70.8" fill="none" stroke="url(#rainbow1)" stroke-width="13" stroke-linecap="round"/>

  <!-- Dynamic Paint Splatters around perimeter -->
  <circle cx="19.4" cy="23.8" r="2.7" fill="#00E5FF"/>
  <circle cx="13.0" cy="48.6" r="2.7" fill="#2979FF"/>
  <circle cx="21.6" cy="77.8" r="2.7" fill="#651FFF"/>
  <circle cx="84.2" cy="88.6" r="2.7" fill="#FF1744"/>
  <circle cx="91.8" cy="75.6" r="2.7" fill="#FF9100"/>
  <circle cx="88.6" cy="23.8" r="2.7" fill="#00E5FF"/>

  <!-- Central Camera Aperture Body -->
  <circle cx="54" cy="54" r="30.2" fill="#161C2B" stroke="#283248" stroke-width="3.2"/>

  <!-- 6 Rotating Curved Aperture Blades -->
  <g transform="translate(54,54)">
    <!-- Blade 0: Cyan -->
    <path d="M 0,-28.7 C 12.1,-21.1 18.1,-6.0 10.6,3.0 L 0,0 Z" fill="#0288D1" fill-opacity="0.8" stroke="#00E5FF" stroke-width="1.3" stroke-opacity="0.4"/>
    <!-- Blade 1: Purple -->
    <path d="M 0,-28.7 C 12.1,-21.1 18.1,-6.0 10.6,3.0 L 0,0 Z" transform="rotate(60)" fill="#7B1FA2" fill-opacity="0.8" stroke="#00E5FF" stroke-width="1.3" stroke-opacity="0.4"/>
    <!-- Blade 2: Magenta -->
    <path d="M 0,-28.7 C 12.1,-21.1 18.1,-6.0 10.6,3.0 L 0,0 Z" transform="rotate(120)" fill="#C2185B" fill-opacity="0.8" stroke="#00E5FF" stroke-width="1.3" stroke-opacity="0.4"/>
    <!-- Blade 3: Cyan -->
    <path d="M 0,-28.7 C 12.1,-21.1 18.1,-6.0 10.6,3.0 L 0,0 Z" transform="rotate(180)" fill="#0288D1" fill-opacity="0.8" stroke="#00E5FF" stroke-width="1.3" stroke-opacity="0.4"/>
    <!-- Blade 4: Purple -->
    <path d="M 0,-28.7 C 12.1,-21.1 18.1,-6.0 10.6,3.0 L 0,0 Z" transform="rotate(240)" fill="#7B1FA2" fill-opacity="0.8" stroke="#00E5FF" stroke-width="1.3" stroke-opacity="0.4"/>
    <!-- Blade 5: Magenta -->
    <path d="M 0,-28.7 C 12.1,-21.1 18.1,-6.0 10.6,3.0 L 0,0 Z" transform="rotate(300)" fill="#C2185B" fill-opacity="0.8" stroke="#00E5FF" stroke-width="1.3" stroke-opacity="0.4"/>
  </g>

  <!-- Central Lens Eye -->
  <circle cx="54" cy="54" r="11.9" fill="#080B12" stroke="#00E5FF" stroke-width="2.2"/>
  <!-- Specular Reflection Highlight -->
  <circle cx="50" cy="50" r="3.8" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Diagonal Paint Brush -->
  <line x1="28" y1="80" x2="90.7" y2="17.3" stroke="url(#brushHandle)" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Ferrule Ring -->
  <circle cx="41.0" cy="67.0" r="5.4" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>

  <!-- Brush Bristle Tip -->
  <path d="M 32.4 75.6 C 23.8 77.8 22.7 85.3 29.2 85.3 C 34.6 84.2 36.7 78.8 32.4 75.6 Z" fill="url(#bristleGrad)"/>

  <!-- White Paint Drop from Tip -->
  <circle cx="22.7" cy="86.4" r="2.2" fill="#FFFFFF"/>
</svg>
